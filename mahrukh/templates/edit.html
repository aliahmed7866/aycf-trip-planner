{% extends 'base.html' %}{% block content %}<div class="page narrow"><a class="breadcrumb" href="{{ url_for('admin') }}">← Seller studio</a><h1>{{ 'Edit your piece' if pid else 'A new addition' }}</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="name" value="{{ item.name }}" maxlength="100" required></label><label>Category<select name="category">{% for c in categories %}<option {% if item.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><div class="form-row"><label>Price (whole PKR)<input type="number" name="price" min="1" max="10000000" value="{{ item.price }}" required></label><label>Original price (optional)<input type="number" name="compare_price" min="0" max="10000000" value="{{ item.compare_price or '' }}"></label></div><label>Fabric details<input name="fabric" value="{{ item.fabric }}" maxlength="200" required></label><label>Description<textarea name="description" rows="5" maxlength="3000">{{ item.description }}</textarea></label><fieldset><legend>Available sizes</legend><div class="size-options">{% for s in sizes %}<label><input type="checkbox" name="sizes" value="{{ s }}" {% if s in item.sizes %}checked{% endif %}><span>{{ s }}</span></label>{% endfor %}</div></fieldset><label>Images (one HTTPS URL or bundled path per line)<textarea name="images" rows="4" required>{{ item.images|join('\n') }}</textarea></label><details><summary>Available illustration paths</summary>{% for a in art %}<p><code>/static/art/{{ a }}.svg</code></p>{% endfor %}</details><label class="check"><input type="checkbox" name="illustration" {% if item.illustration %}checked{% endif %}> Label images as illustrations / sample designs</label><label class="check"><input type="checkbox" name="active" {% if item.active %}checked{% endif %}> Visible in the collection</label><button class="button">Save piece ↗</button></form></div>{% endblock %}
