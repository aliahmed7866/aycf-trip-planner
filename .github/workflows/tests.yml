name: tests

on:
  push:
    branches: [main, deploy/termux]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate Python syntax
        run: python -m compileall -q .
      - name: Validate Termux shell scripts
        run: |
          for script in termux/*.sh; do
            bash -n "$script" || exit 1
          done
      - name: Run tests
        run: python -m pytest -q

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and browser dependencies
        run: |
          pip install -r requirements-dev.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate desktop and mobile settings and trips
        env:
          BROWSER_ARTIFACT_DIR: browser-artifacts
        run: python -m pytest -q tests/test_exclusion_browser.py tests/test_short_trips.py
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-exclusions-browser
          path: browser-artifacts/
          if-no-files-found: ignore
