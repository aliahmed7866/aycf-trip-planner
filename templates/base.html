<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>AYCF Flight Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --bg:#070b14;--bg-2:#0b1220;--panel:rgba(16,24,40,.78);--panel-strong:rgba(18,28,48,.94);
      --line:rgba(148,163,184,.15);--line-strong:rgba(148,163,184,.26);--text:#f8fafc;--muted:#9aa8bd;
      --primary:#7c8cff;--primary-2:#5e6bf2;--success:#44d7a8;--danger:#ff7185;--warning:#f7c85d;
      --shadow:0 24px 70px rgba(0,0,0,.34);--radius:22px;--radius-sm:14px;
    }
    *{box-sizing:border-box} html{background:var(--bg)}
    body{min-height:100vh;margin:0;background:
      radial-gradient(circle at 15% -5%,rgba(124,140,255,.20),transparent 28rem),
      radial-gradient(circle at 95% 15%,rgba(68,215,168,.10),transparent 24rem),
      linear-gradient(180deg,var(--bg) 0%,#090f1d 55%,#070b14 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 72%)}
    a{text-decoration:none}.app-shell{position:relative;z-index:1}.container{max-width:1180px}
    .navbar{position:sticky;top:0;z-index:1040;background:rgba(7,11,20,.76);border-bottom:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%)}
    .navbar-brand{display:flex;align-items:center;gap:.55rem;letter-spacing:-.02em}.brand-mark{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:linear-gradient(145deg,var(--primary),#9d78ff);box-shadow:0 8px 30px rgba(124,140,255,.30);font-size:.72rem;font-weight:800;letter-spacing:.08em}.brand-copy{line-height:1.05}.brand-copy small{display:block;margin-top:.22rem;color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
    .nav-pills-aycf{display:flex;gap:.35rem}.nav-pills-aycf a{padding:.55rem .78rem;color:var(--muted);border:1px solid transparent;border-radius:11px;font-size:.86rem;font-weight:650}.nav-pills-aycf a:hover,.nav-pills-aycf a:focus-visible{color:var(--text);background:rgba(255,255,255,.06);border-color:var(--line)}
    main.container{padding-top:1rem}.glass,.card{background:linear-gradient(180deg,rgba(20,30,51,.83),rgba(13,20,35,.78));border:1px solid var(--line)!important;box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 20px 55px rgba(0,0,0,.16);backdrop-filter:blur(14px)}
    .card{border-radius:var(--radius);overflow:hidden}.card .card{border-radius:17px}.card-body{position:relative}.shadow-sm{box-shadow:var(--shadow)!important}
    h1,h2,h3,h4,h5,h6,.form-label{color:var(--text)!important;letter-spacing:-.025em}.text-muted,.text-muted-2,.form-text,.small.text-muted{color:var(--muted)!important}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    hr{border-color:var(--line-strong)!important}.border,.border-top,.border-bottom,.border-start,.border-end{border-color:var(--line)!important}
    .form-label{font-size:.82rem;font-weight:700;letter-spacing:.01em}.form-control,.form-select{min-height:46px;color:var(--text)!important;background:rgba(5,10,20,.56)!important;border:1px solid var(--line-strong)!important;border-radius:13px;box-shadow:none!important}.form-control::placeholder{color:#718096!important}.form-control:hover,.form-select:hover{border-color:rgba(124,140,255,.45)!important}.form-control:focus,.form-select:focus{border-color:var(--primary)!important;box-shadow:0 0 0 4px rgba(124,140,255,.13)!important;background:rgba(7,13,25,.82)!important}option{background:#101827;color:var(--text)}
    .btn{min-height:40px;border-radius:12px;font-weight:700;letter-spacing:-.01em;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn-primary{border-color:transparent!important;background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 9px 26px rgba(94,107,242,.25)}.btn-primary:hover{box-shadow:0 12px 32px rgba(94,107,242,.34)}.btn-outline-light,.btn-outline-secondary{color:#e9eef8!important;background:rgba(255,255,255,.025)!important;border-color:var(--line-strong)!important}.btn-outline-light:hover,.btn-outline-secondary:hover{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.32)!important}.btn-outline-danger{color:#ff9aaa;border-color:rgba(255,113,133,.38)}
    .badge{padding:.46rem .62rem;border-radius:999px;font-weight:750;letter-spacing:.01em}.badge-soft{color:#dfe3ff!important;background:rgba(124,140,255,.13);border:1px solid rgba(124,140,255,.28)}.badge-soft-2{color:#baf7df!important;background:rgba(68,215,168,.11);border:1px solid rgba(68,215,168,.25)}
    .table{--bs-table-bg:transparent;--bs-table-color:var(--text);--bs-table-striped-bg:rgba(255,255,255,.025);--bs-table-striped-color:var(--text);margin:0}.table thead th{padding:.9rem .8rem;color:#91a0b6!important;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)!important}.table tbody td{padding:.95rem .8rem;border-color:var(--line)!important}.table tbody tr:hover{background:rgba(124,140,255,.045)}
    .list-group-item{padding:.9rem;background:rgba(255,255,255,.035)!important;border-color:var(--line)!important;color:var(--text)!important}.list-group-item:hover{background:rgba(124,140,255,.08)!important}
    .modal-content,.offcanvas,.dropdown-menu{background:var(--panel-strong)!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:22px;box-shadow:var(--shadow)}.modal-content .btn-close{filter:invert(1);opacity:.8}
    .alert{border-radius:15px;border:1px solid var(--line)!important}.toast{background:rgba(14,22,38,.96)!important;border:1px solid var(--line)!important;border-radius:15px!important;box-shadow:var(--shadow)}
    .route-panel{position:relative;overflow:hidden}.route-panel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}.bg-success-subtle.route-panel:before{background:var(--success)}.route-line{margin-top:.45rem;color:#f8fbff!important;font-weight:750;letter-spacing:-.01em}.route-line--muted{font-weight:600;color:#c5cfdd!important}
    .bg-primary-subtle,.bg-success-subtle,.bg-warning-subtle,.bg-info-subtle{color:var(--text)!important;background:rgba(255,255,255,.035)!important}
    .form-check-input{background-color:rgba(255,255,255,.08);border-color:var(--line-strong)}.form-check-input:checked{background-color:var(--primary);border-color:var(--primary)}
    .sticky-mobile-action{background:linear-gradient(180deg,transparent,rgba(7,11,20,.95) 40%)}
    .journey-strip{display:none!important}
    @media(max-width:991.98px){.navbar-collapse{padding-top:.8rem}.navbar .ms-auto{align-items:stretch!important;flex-direction:column}.nav-pills-aycf{width:100%;margin-bottom:.35rem}.nav-pills-aycf a{flex:1;text-align:center;background:rgba(255,255,255,.025);border-color:var(--line)}}
    @media(max-width:575.98px){main.container{padding-left:.85rem;padding-right:.85rem}.navbar .container{padding-left:.85rem;padding-right:.85rem}.card{border-radius:18px}.card-body{padding:1rem!important}.btn-lg{min-height:50px;font-size:1rem}.table thead th,.table tbody td{padding:.78rem .65rem}.modal-dialog{margin:0}.modal-content{border-radius:0;min-height:100dvh}.badge{font-size:.78rem}.planner-hero .lead-copy{display:none!important}.planner-hero{padding-bottom:.75rem!important;margin-bottom:.75rem!important}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body class="text-light">
<div class="app-shell">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container py-2">
      <a class="navbar-brand fw-semibold" href="/">
        <span class="brand-mark">AYCF</span><span class="brand-copy">Flight Console<small>Trip intelligence</small></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navMain">
        <div class="ms-auto d-flex gap-2 align-items-center">
          <div class="nav-pills-aycf"><a href="/">Planner</a><a href="/watches">Flight watches</a></div>
          <form method="post" action="/refresh" class="m-0"><button class="btn btn-outline-light btn-sm w-100" type="submit">↻ Refresh data</button></form>
        </div>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="mt-3">{% for category, message in messages %}<div class="alert alert-{{category}} glass text-light mb-2">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
    {% block content %}{% endblock %}
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:2000"><div id="toast" class="toast text-light" role="alert" aria-live="assertive" aria-atomic="true"><div class="d-flex"><div class="toast-body" id="toastBody">Copied</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div></div></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const Picker=(()=>{const state={activeKey:null,options:{bases:[],hubs:[],targets:[]},selected:{bases:new Set(),hubs:new Set(),targets:new Set()}};const el=id=>document.getElementById(id);
function setOptions(key,arr){state.options[key]=Array.isArray(arr)?arr:[]}
function hydrate(){["bases","hubs","targets"].forEach(key=>{state.selected[key].clear();document.querySelectorAll(`input[name='${key}']`).forEach(inp=>{if(inp.value)state.selected[key].add(inp.value)})})}
function updateSummary(key){const wrap=el(`summary-${key}`),count=el(`count-${key}`);if(!wrap||!count)return;const values=[...state.selected[key]].sort();count.textContent=values.length?`${values.length} selected`:"None selected";wrap.innerHTML="";if(!values.length){const s=document.createElement("span");s.className="text-muted-2 small";s.textContent="Nothing selected";wrap.appendChild(s);return}values.slice(0,6).forEach(v=>{const c=document.createElement("span");c.className="badge badge-soft me-1 mb-1";c.textContent=v;wrap.appendChild(c)});if(values.length>6){const m=document.createElement("span");m.className="badge badge-soft-2 me-1 mb-1";m.textContent=`+${values.length-6} more`;wrap.appendChild(m)}}
function write(key){const host=el(`hidden-${key}`);if(!host)return;host.innerHTML="";[...state.selected[key]].sort().forEach(v=>{const i=document.createElement("input");i.type="hidden";i.name=key;i.value=v;host.appendChild(i)});updateSummary(key)}
function render(filterText=""){const key=state.activeKey,list=el("picker-list");if(!list||!key)return;list.innerHTML="";const q=(filterText||"").toLowerCase().trim(),opts=state.options[key]||[],sel=state.selected[key];let visible=q?opts.filter(o=>String(o).toLowerCase().includes(q)):[...opts.filter(o=>sel.has(o)),...opts.filter(o=>!sel.has(o))];const cap=400;visible.slice(0,cap).forEach(city=>{const row=document.createElement("button");row.type="button";row.className="list-group-item list-group-item-action d-flex justify-content-between align-items-center";const left=document.createElement("div");left.className="d-flex flex-column";const name=document.createElement("div");name.className="fw-semibold";name.textContent=city;const sub=document.createElement("div");sub.className="text-muted-2 small";sub.textContent=key==="bases"?"Base":key==="hubs"?"Hub option":"Target option";left.append(name,sub);const right=document.createElement("div");right.className="form-check m-0";const cb=document.createElement("input");cb.type="checkbox";cb.className="form-check-input";cb.checked=sel.has(city);cb.addEventListener("click",e=>e.stopPropagation());cb.addEventListener("change",()=>{cb.checked?sel.add(city):sel.delete(city);if(el("picker-livecount"))el("picker-livecount").textContent=`${sel.size} selected`});right.appendChild(cb);row.append(left,right);row.addEventListener("click",()=>{sel.has(city)?sel.delete(city):sel.add(city);cb.checked=sel.has(city);if(el("picker-livecount"))el("picker-livecount").textContent=`${sel.size} selected`});list.appendChild(row)});if(el("picker-hint"))el("picker-hint").textContent=visible.length>cap?`Showing first ${cap} matches. Refine your search.`:`${visible.length} option(s)`;if(el("picker-livecount"))el("picker-livecount").textContent=`${sel.size} selected`}
function open(key){state.activeKey=key;hydrate();if(el("pickerTitle"))el("pickerTitle").textContent=key==="bases"?"Select bases":key==="hubs"?"Select hubs":"Select targets";const search=el("picker-search");if(search)search.value="";if(el("picker-all"))el("picker-all").onclick=e=>{e.preventDefault();(state.options[key]||[]).forEach(o=>state.selected[key].add(o));render(search?search.value:"")};if(el("picker-none"))el("picker-none").onclick=e=>{e.preventDefault();state.selected[key].clear();render(search?search.value:"")};if(search)search.oninput=()=>render(search.value);render();new bootstrap.Modal(el("cityPickerModal")).show()}
function done(){if(state.activeKey)write(state.activeKey);["bases","hubs","targets"].forEach(updateSummary)}
function init(initial){setOptions("bases",initial.bases||[]);setOptions("hubs",initial.hubs||[]);setOptions("targets",initial.targets||[]);hydrate();["bases","hubs","targets"].forEach(updateSummary);if(el("picker-done"))el("picker-done").onclick=done;const modal=el("cityPickerModal");if(modal)modal.addEventListener("hidden.bs.modal",()=>{if(state.activeKey)write(state.activeKey);["bases","hubs","targets"].forEach(updateSummary)})}
return{init,open}})();
function showToast(msg){const node=document.getElementById("toast"),body=document.getElementById("toastBody");if(!node||!body)return;body.textContent=msg;new bootstrap.Toast(node).show()}
function copyText(txt,label){try{navigator.clipboard.writeText(txt);showToast((label||"Copied")+" ✓")}catch(e){showToast("Copy failed")}}
document.addEventListener("DOMContentLoaded",()=>{if(window.__PICKER_OPTIONS__)Picker.init(window.__PICKER_OPTIONS__);document.querySelectorAll("[data-picker-open]").forEach(btn=>btn.addEventListener("click",e=>{e.preventDefault();Picker.open(btn.getAttribute("data-picker-open"))}))});
</script>
</body>
</html>
